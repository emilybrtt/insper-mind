spring.application.name=insperMind

# --- CONEXAO COM O POSTGRESQL (AIVEN) ---
spring.datasource.url=jdbc:postgresql://insper-mind-insper-mind.c.aivencloud.com:10001/defaultdb?ssl=require
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# --- CONFIGURACOES DO HIBERNATE (JPA) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.data.web.pageable.max-page-size=100